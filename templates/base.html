<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FYP Grading Tool{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <h1>FYP Grading Tool</h1>
        <nav>
            <a href="/">Upload</a>
            <a href="/results">Results</a>
        </nav>
    </header>

    <main>
        <!-- This is where each page's content gets injected -->
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>FYP Grading Tool — Final Year Project 2026</p>
    </footer>
</body>
</html>
