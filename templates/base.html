<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FYP Grading Tool{% endblock %}</title>
    
    <!-- Bootstrap 5 CSS from CDN. no installation needed -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
          rel="stylesheet">
    
    <!-- Our custom CSS — loaded AFTER Bootstrap so our styles can override if needed -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- Bootstrap navbar component -->
    <!-- navbar-expand-md: collapses into a hamburger menu on small screens -->
    <!-- navbar-dark bg-dark: white text on dark background -->
    <nav class="navbar navbar-expand-md navbar-dark bg-dark">
        <div class="container">
            <!-- Brand/logo -->
            <a class="navbar-brand fw-bold" href="/">FYP Grading Tool</a>
            
            <!-- Hamburger button for mobile. only shows on small screens -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" 
                    data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <!-- Navigation links -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <!-- ms-auto pushes the links to the right side -->
                    <li class="nav-item">
                        <a class="nav-link" href="/">Upload</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/bulk">Bulk upload</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/grading">Results</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main content area -->
    <!-- container: centers content with max-width and padding -->
    <!-- my-4: margin top and bottom -->
    <main class="container my-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="container text-center text-muted py-4 border-top mt-4">
        <small>FYP Grading Tool — Final Year Project 2026</small>
    </footer>

    <!-- Bootstrap 5 JavaScript from CDN — needed for navbar toggle, dropdowns, etc. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
